# Bot 与人格：Bot 身份、群聊回复策略、日程、人格与对话记忆参数；文件由 WebUI 保存时整体重写。

[inner]
version = "1.5.0"

[bot] # 身份与关系：Bot 的显示名、别名和对用户的称呼。
name = "月璃" # Bot 的显示名，也会作为系统提示词中的身份名；不能为空，也不能与别名重复。
aliases = [] # 群聊里也会回应的其它称呼，每行一个；不能为空、重复或等于 Bot 名字。
user_nickname = "" # Bot 对用户的称呼偏好；留空表示不主动使用特定称呼。
relationship = "" # Bot 和用户的关系，例如“哥哥”“姐姐”“朋友”；留空则不预设关系。

[group_chat] # 群聊策略：群聊中 @、名字触发和回复频率的控制参数。
at_mention_must_reply = true # 开启时协议 @ 提及不受睡眠与群聊回复窗口限制。
name_mention_probability = 1.0 # 名字、别名或非必回 @ 命中后的回复概率，范围 0~1。
presence_decay_strength = 3.0 # 数值越大，Bot 在群里说得越多时越倾向于让别人先说；范围 0~20。
persona_weight = 0.05 # 群聊里人格增量的折算系数；一句一答的消耗远小于面对面长聊。
reply_window_minutes = 10 # 在这段时间窗口内统计 Bot 已经回复了多少次。
max_replies_in_window = 3 # 非必回消息在时间窗口内允许的最大回复次数；0 表示不限制。
reactions_enabled = true # 开启后她可以在别人的消息上点一个 QQ 表情，不发新消息。关闭后 react 不进入动作集。
pokes_enabled = false # 开启后她可以戳一戳群里某个人；戳一戳会给对方推送提醒，扰动比表情回应大，默认关闭。
self_started_topics = true # 开启后她可以在没有可回应消息时主动发起话题；受同一条回复频率闸门约束，不会额外增加开口次数。
scene_refresh_messages = 15 # 群里每积累这么多条新消息就在后台重算一次场景画像；0 表示关闭观察，系统提示词里不再有场景块。

[schedule] # 每日方向与活动：控制活动能否进入睡眠、方向生成失败时的备用主题与重试节奏。
sleep_enabled = true # 开启后活动模型可以选择 sleep；关闭后仍可选择会正常回应的 rest。
fallback_theme = "按自己的节奏度过今天。" # 每日方向生成失败时使用的当日主题，1~72 字符。
generation_retry_interval_minutes = 10 # 日程生成失败后再次尝试前等待的分钟数。

[personality] # 人设与说话方式：Bot 的稳定人设、生日、回复风格和表达习惯候选。
birthday = "" # 格式 YYYY-MM-DD；留空时不派生年龄与生日提示，也不能晚于今天。
personality = "" # 稳定身份、经历、外表与性格；只从这份配置进入提示词。
reply_style = "" # 句长、语气、排版和收尾习惯。
tone_probability = 0.0 # 新会话抽取临时语调的概率；0 表示始终不抽取。
tone_variants = [] # 候选的会话级语调，每行一条，只在新会话开始时至多抽取一条。

[conversation] # 对话与记忆：工作记忆窗口、摘要节奏和记忆召回数量。
working_memory_messages = 40 # 每轮送进模型的最近消息条数，不含系统提示词。
summarize_trigger_messages = 48 # 未摘要消息达到此数量后触发一次长期记忆摘要。
summarize_batch_messages = 16 # 每次摘要消化的最老消息条数；必须小于触发数量。
fact_extract_trigger_messages = 32 # 累计多少条消息后回看一次并抽取长期事实；比摘要更密，因为事实的时效性更强。
fact_extract_batch_messages = 12 # 每次抽取回看的最旧消息条数，必须小于触发消息数。
session_gap_minutes = 30 # 超过此空闲时长视为新会话，并重新抽取临时语调。
fact_recall_limit = 6 # 每轮最多召回的事实记忆数量；0 表示不召回事实。
recalled_episode_limit = 2 # 按当前输入相关性召回的情节数量。
recent_episode_limit = 2 # 无论相关性如何都补充的最近情节数量。
episode_context_limit = 3 # 去重后最终写入系统提示词的情节总上限。
private_facts_in_group = false # 私聊里听到的人物事实能否出现在群聊提示词中；默认关闭，事实只在被听见的场合可见。

[conversation_agent] # Conversation 行动核心：多智能体行动核心的灰度开关、触发口径与测试流清单。
mode = "off" # off 保留旧管线；shadow 只记录决策；selected_streams 只对清单内会话生效；enabled 对全部真实候选生效。
selected_streams = [] # mode=selected_streams 时生效的 stream ID 清单，每行一个。
split_replyer = true # 打开后发言要跑两次模型：先定动作，再写正文，首字延迟明显上升。想压延迟就在模型配置里给「行动决策」单独指一个快模型。沉默、等待、贴表情、戳一戳不受影响。
tool_calling = true # 默认开启，且依赖决策与表达分开调用。行动决策模型必须支持工具调用；开启时同时使用扁平 item 上下文，关闭后改用旧 XML 动作协议。
trigger_mode = "signal" # signal 沿用原口径；frequency 按发言频率给候选；reply_necessity 按回复必要性评分。
frequency_talk_value = 0.6 # frequency 模式的消息条数尺度，必须大于 0 且不超过 1。
reply_necessity_threshold = 80 # reply_necessity 模式的评分阈值，0~100。
max_cognitive_rounds = 2 # 一个回合内允许的认知轮次上限；每一轮都可能发起一次模型调用。

[typing] # 打字节奏：一段话切成几条气泡、每条之间隔多久。
bubble_target_chars = 18 # 先按标点切成最小片段，再合并到接近该长度为止；必须大于 0。
max_bubbles_per_say = 3 # 话越长每条也越长，条数不随长度无限增长；至少为 1。
delay_enabled = true # 关闭后多条气泡会连续发出。
chinese_char_seconds = 0.28 # 中文按整字输入计价。
latin_char_seconds = 0.12 # 字母与数字连打明显快于中文。
send_gap_seconds = 0.4 # 打完到按下回车之间的固定停顿。
max_delay_seconds = 8.0 # 长内容按字数线性算会让对方干等，超过上限即截断。
emoji_pick_seconds = 1.5 # 表情包不逐字打，不走字数公式。

[typing.follow_up] # 静默主动追问：Bot 正常回复后对方一直没回，达到阈值时先做独立情景分析，再让行动核心结合历史选择 reply 或 silent；只在 Conversation Agent 已启用或被 selected_streams 选中的私聊生效。
enabled = true # 关闭后不创建一分钟静默决策任务，输入状态决策仍可独立工作。
peer_silence_minutes = 1.0 # Bot 正常回复后对方持续不回复这么久，创建一次 reply / silent 决策机会；必须大于 0。

[typing.nudge] # 久等后的催促：从 Bot 正常回复起达到总静默阈值，看到对方开始打字时让行动核心决定是否再追问；只在私聊生效。
enabled = true # 关闭后输入状态通知只被记录后丢弃。
peer_silence_minutes = 3.0 # 从 Bot 正常回复起累计静默这么久才允许输入状态触发追问；中间的定时追问不重新计时。
max_per_silence = 2 # 只统计行动核心实际选择 reply 并成功投递的次数；选择 silent 不消耗次数。默认上限为 2。

[emoji] # 表情包库：表情包库的容量、收集与淘汰参数。
max_count = 1000 # 可发送表情的最大条数；0 表示不限。超过后由后台维护任务按「最少用、最久没用」收回到该值为止。
auto_evict = true # 库满后是否自动淘汰最冷的条目；关闭时只记录超限告警，不删除任何记录。
check_interval_minutes = 5 # 两次库容量检查之间的最小间隔，单位分钟；必须大于 0。
max_file_size_mb = 5.0 # 收集时的单文件大小上限，单位 MB；0 表示不限。
content_filtration = false # 入库前是否调用视觉模型审查内容；关闭时零模型调用，开启但视觉模型不可用时拒绝入库并告警。
collect_enabled = true # 是否从聊天里自动收集表情包；关闭后入站图片只识别不入库。

[emoji.cleanup] # 孤儿文件清理：清理目录里库里没有记录的孤儿文件；只控制后台任务的节奏与保留期。
enabled = true # 是否定期清理目录里库里没有记录的孤儿文件；关闭后孤儿文件只会被巡检报告，不会被删除。
check_interval_hours = 6.0 # 两次孤儿清理检查之间的最小间隔，单位小时；必须大于 0。
orphan_retention_days = 30 # 孤儿文件至少保留多少天；0 表示下次检查时立即清理。

[desktop_pet] # 实验性功能 · 桌宠：实验性功能，默认关闭，开启后可能遇到未知问题。桌宠外壳总开关：桌面窗口、前台感知与桌面主动搭话；关闭后只保留托盘和后端。
enabled = false # 实验性功能，可能有未知 bug。开启后启动时创建桌宠窗口并采集前台窗口与键鼠活动；关闭后只保留托盘和后端（QQ 与 WebUI 不受影响），桌面主动搭话一并停用。改动需重启应用生效。

