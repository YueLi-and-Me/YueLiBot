# 模型与任务：模型定义、八类任务候选与按任务拆分的生成参数；文件由 WebUI 保存时整体重写。

[inner]
version = "1.5.0"

[model_tasks.chat] # 日常对话：回复用户普通消息的对话模型；至少要有一个。
model_list = ["deepseek-pro"] # 每行一个 models.toml 中的模型名称；列表顺序只在「顺序优先」策略下决定先后。
selection_strategy = "sequential" # sequential 永远优先第一条；random 每次随机打乱；balance 在健康候选之间逐轮分摊请求。
first_token_timeout_ms = 30000 # 候选切换窗口；窗口耗尽会直接切换下一个候选模型。
slow_threshold_ms = 8000 # 只用于慢响应记账；必须小于首字超时，0 表示关闭。

[model_tasks.planner] # 行动决策：决定这一轮做什么动作的模型；留空继承对话候选。首字延迟主要由它决定。
model_list = ["deepseek-flash"] # 每行一个 models.toml 中的模型名称；列表顺序只在「顺序优先」策略下决定先后。
selection_strategy = "sequential" # sequential 永远优先第一条；random 每次随机打乱；balance 在健康候选之间逐轮分摊请求。
first_token_timeout_ms = 30000 # 候选切换窗口；窗口耗尽会直接切换下一个候选模型。
slow_threshold_ms = 8000 # 只用于慢响应记账；必须小于首字超时，0 表示关闭。

[model_tasks.replyer] # 回复生成：把决策写成她实际说出口那句话的模型；留空继承对话候选。
