temperature = 0.85 # 采样温度；低温度更确定，高温度更有创造性。
max_tokens = 0 # 最大输出 token 数；0 表示不额外限制，沿用厂商上限。

[generation.proactive] # 主动搭话：主动搭话消息的采样参数。
