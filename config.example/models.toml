selection_strategy = "sequential" # sequential 永远优先第一条；random 每次随机打乱；balance 在健康候选之间逐轮分摊请求。
first_token_timeout_ms = 30000 # 候选切换窗口；窗口耗尽会直接切换下一个候选模型。
slow_threshold_ms = 8000 # 只用于慢响应记账；必须小于首字超时，0 表示关闭。

