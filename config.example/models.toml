[[models]] # 一个「模型目录」条目
name = "deepseek-pro" # 任务候选引用的唯一名称；不能与其他模型重复。
model_identifier = "deepseek-v4-pro-0813" # 厂商接口接受的真实模型 ID；留空的模型被任务引用时会在加载期报错。
api_provider = "dashscope" # 必须引用 providers.toml 中存在的厂商名称。
extra_body = { enable_thinking = false } # 需要透传给厂商请求体的额外参数；JSON 对象格式，例如 {"thinking":{"type":"disabled"}}。
reasoning_parse_mode = "field" # 解析模型思考内容的方式：field 从响应字段读取，tag 从文本标签解析，none 不解析。
visual = false # 标记该模型可用于 vision / 图片描述任务。
price_in = 0.0 # 可选计费参考价，单位元/百万 token；仅用于 WebUI 展示。
price_out = 0.0 # 可选计费参考价，单位元/百万 token；仅用于 WebUI 展示。
embedding_dim = 0 # 仅嵌入模型需要填写；同一任务下的候选向量模型必须维度一致。
