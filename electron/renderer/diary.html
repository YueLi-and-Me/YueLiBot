<!--
  日记只读页面的结构模板。

  diary.ts 通过 preload bridge 读取后端日记数据并填充日期、摘要和事实区域；
  页面不提供业务写入表单，样式由 styles/diary.css 负责。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
    <title>Bot 日记</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/diary.css" />
  </head>
  <body>
    <main class="diary-shell">
      <header class="diary-header">
        <p class="diary-kicker">写给今天</p>
        <h1>Bot 日记</h1>
      </header>
      <section id="today" class="inner"></section>
      <section id="memories" class="inner"></section>
      <section id="change-section" class="inner" hidden></section>
      <div id="list"><div class="empty">读取中…</div></div>
    </main>
    <script type="module" src="./diary.ts"></script>
  </body>
</html>
