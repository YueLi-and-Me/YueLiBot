<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>月璃观察面板</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/observability.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">YUELI / INTERNAL</p>
          <h1>月璃观察面板</h1>
          <p class="subtitle">只读运行快照，含完整提示词与对话正文</p>
        </div>
        <div class="toolbar" aria-label="快照读取控制">
          <button id="open-settings" class="button secondary" type="button">设置…</button>
          <button id="refresh" class="button" type="button">刷新快照</button>
          <label class="toggle"><input id="auto-refresh" type="checkbox" />自动刷新</label>
          <time id="fetched-at" class="timestamp">尚未读取</time>
        </div>
      </header>
      <aside id="status" class="status-strip" aria-label="关键状态"></aside>
      <main id="grid" class="panel-grid"><p class="empty">正在读取内部状态…</p></main>
      <section class="panel-card wide trace-panel" aria-label="运行时调试追踪">
        <header class="section-heading">
          <div class="section-title">
            <h2>对话轮次</h2>
          </div>
          <span id="trace-count" class="section-subtitle">0 条 · 实时轮询中</span>
        </header>
        <div id="turn-cards" class="turn-card-list"><p class="empty">等待第一轮对话…</p></div>
        <header class="section-heading">
          <div class="section-title">
            <h2>后台事件</h2>
          </div>
          <span class="section-subtitle">感知 / 睡眠</span>
        </header>
        <div id="trace-log" class="trace-log"><p class="empty">等待第一条后台事件…</p></div>
      </section>
    </div>
    <script type="module" src="./observability.ts"></script>
  </body>
</html>
