<!--
  后端观察 WebUI 的入口文档。

  页面只声明基础元信息与 #root 挂载容器，全部界面由 src/main.tsx 装配的 React
  应用渲染；样式经 src/index.css 由 Tailwind 编译后随构建产物注入。

  约束说明：
  - 严格 CSP 禁止内联脚本与外部资源，图标一律使用打包进 JS 的内联 SVG，字体只
    使用系统栈；开发服务器下该 meta 由 vite.config.ts 的钩子移除，以放行
    react-refresh 必需的内联 preamble。
  - 主题由 <html> 上的 data-theme 属性控制（light / dark），属性在 React 首次
    渲染前由 src/lib/theme.ts 写入。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*; style-src 'self' 'unsafe-inline'"
    />
    <title>Bot 观察面板</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>观察面板需要启用 JavaScript 才能读取后端运行状态。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
