<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws://127.0.0.1:*; style-src 'self' 'unsafe-inline'"
    />
    <title>Bot 观察面板</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="login-shell">
      <section id="login-panel" class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">YUELI / WEBUI</p>
        <h1 id="login-title">Bot 观察面板</h1>
        <p class="subtitle">输入后端启动时公告的 token。登录后凭据只保存在 HttpOnly Cookie 中。</p>
        <form id="login-form">
          <label for="token">后端 token</label>
          <input id="token" name="token" type="password" autocomplete="off" required />
          <button type="submit">登录</button>
          <p id="login-error" class="error" role="alert" aria-live="polite"></p>
        </form>
      </section>
      <section id="panel-shell" class="app-shell" hidden>
        <nav class="page-nav" aria-label="观察面板页面">
          <a href="/">会话观察</a>
          <a href="/persons">人物画像</a>
        </nav>
        <section id="conversation-view">
          <header class="app-header">
            <div>
              <p class="eyebrow">YUELI / WEBUI</p>
              <h1>Bot 观察面板</h1>
              <p class="subtitle">按会话流读取的只读运行快照</p>
            </div>
            <div class="toolbar" aria-label="快照读取控制">
              <label for="stream-select">会话流</label>
              <select id="stream-select"></select>
              <button id="refresh" type="button">刷新快照</button>
              <label class="toggle"><input id="auto-refresh" type="checkbox" />自动刷新</label>
              <time id="fetched-at" class="muted mono">尚未读取</time>
            </div>
          </header>
          <aside id="status" class="status-strip" aria-label="关键状态"></aside>
          <section class="panel-card" aria-label="各会话当前阶段">
            <header class="section-heading">
              <h2>此刻在做什么</h2>
              <span class="section-subtitle">每条会话停在哪一步、停了多久</span>
            </header>
            <div id="stage-board" class="stage-board"><p class="empty">尚未收到任何消息。</p></div>
          </section>
          <div id="grid" class="panel-grid"><p class="empty">正在读取内部状态…</p></div>
          <section class="panel-card trace-panel" aria-label="运行时调试追踪">
            <header class="section-heading">
              <h2>Trace 回放</h2>
              <div class="toolbar compact">
                <label for="trace-filter">kind 过滤</label>
                <select id="trace-filter">
                  <option value="all">全部</option>
                  <option value="observation">observation（没回的群消息）</option>
                  <option value="reply_gate">reply_gate（回不回的判定）</option>
                  <option value="expression_select">expression_select</option>
                  <option value="interest">interest</option>
                  <option value="proactive_intent">proactive_intent</option>
                  <option value="vision_glance">vision_glance</option>
                </select>
                <span id="trace-count" class="section-subtitle">0 条</span>
              </div>
            </header>
            <h3>对话轮次</h3>
            <div id="turn-cards" class="turn-card-list"></div>
            <h3>后台事件</h3>
            <div id="trace-log" class="trace-log"></div>
          </section>
          <section class="panel-card log-panel" aria-label="实时日志">
            <header class="section-heading">
              <h2>实时日志</h2>
              <span id="log-status" class="section-subtitle">正在连接</span>
            </header>
            <div id="log-output" class="log-output" aria-live="polite"></div>
          </section>
        </section>
        <section id="persons-view" hidden>
          <header class="app-header">
            <div>
              <p class="eyebrow">YUELI / PERSONS</p>
              <h1 id="persons-title">人物画像</h1>
              <p id="persons-subtitle" class="subtitle">每个人的身份、关系与事实记忆彼此独立。</p>
            </div>
            <a class="button-link" href="/">返回会话观察</a>
          </header>
          <div id="persons-grid" class="panel-grid"><p class="empty">正在读取人物画像…</p></div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
