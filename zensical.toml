    ] },
    { "出站图片验收" = "dev/outbound-image-acceptance.md" },
  ] },
]

[project.theme]
language = "zh"

# 下列特性取自 Zensical 模板的推荐集，逐项取舍见各自注释。
# navigation.instant 依赖 site_url 生成的 sitemap.xml，site_url 未设置时会静默失效。
features = [
  # 代码块内的注释角标、复制与整块选中，站点大量使用命令行示例，缺了就只剩裸 pre。
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  # 标签页共享选中状态，同一页上并列的多份配置片段切换时不会各自复位。
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  # 面包屑：两套手册层级较深，没有它时只能靠浏览器后退。
  "navigation.path",
  "navigation.sections",
  # 顶层三项（首页 / 用户手册 / 开发手册）做成横向标签，读者一眼分得清两套文档。
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# 站点图标用角色头像：docs/images/ 下是从 assets/character 的立绘裁出来的小尺寸副本，
# 原图在 docs_dir 之外不会进入构建产物，这三张副本合计不到 150 KB。
logo = "images/logo.png"
favicon = "images/favicon.png"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/YueLi-and-Me/YueLiBot"

[[project.extra.social]]
icon = "fontawesome/solid/comments"
link = "https://github.com/YueLi-and-Me/YueLiBot/issues"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换主题"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切换到深色模式"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
# 正文里存在中文标题的交叉引用（如 docs/README.md 的「#用户手册」）。
#
# 默认的 python-markdown slugify 会丢弃非 ASCII 字符，中文标题只能退化成 _1、_2
# 这类位置相关的编号，锚点既不可读也会随标题增删而失效；改用 pymdownx 的
# uslugify 后锚点保留中文原文。kwds 的 case 必须为小写，否则同一标题的大小写
# 变体会落到两个不同锚点上。
toc.permalink = true
toc.slugify.kwds.case = "lower"
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# 架构文档里的 ASCII 流程图都写在围栏代码块内，超级围栏据此渲染 mermaid 块。
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
