# 月璃文档站配置：把仓库里的 docs/ 渲染成静态站，由 GitHub Actions 构建后
# 发布到 Cloudflare Workers 静态资源（Worker 名与路由见仓库根的 wrangler.toml）。
#
# 上游选型说明：Material for MkDocs 已于 2025-11-06 进入最终维护期（2026-11-05 停止支持），
# 官方指定的继任者是同一团队开发的 Zensical，配置模型沿用 MkDocs 的约定。
# 本文件只被 docs 构建读取，不参与 pytest / vitest / tsc 三条门，也不影响运行时代码。

[project]
site_name = "月璃 · 文档"
site_description = "月璃 YueLiBot 的用户手册与开发手册"
# site_url 决定 sitemap.xml、canonical 链接与 navigation.instant 的预取目标。
# 正式入口是 wrangler.toml 里绑定的 Custom Domain；换域名时两处必须同步，
# 否则 sitemap、canonical 与站内预取都会指向旧地址。
site_url = "https://docs.yuelibot.org/"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/YueLi-and-Me/YueLiBot"
repo_name = "YueLi-and-Me/YueLiBot"
# 每页的「编辑此页」固定指向 main：站点由 main 构建，dev 分支上的草稿不应成为公开入口。
edit_uri = "edit/main/docs/"
copyright = "月璃 YueLiBot 贡献者 · AGPL-3.0"
# 站点自定义样式：配色、卡片悬停与进场动画。路径相对 docs_dir。
extra_css = ["stylesheets/extra.css"]

# 导航显式声明，不走目录自动推断。
#
# 原因：docs/ 下的文件名是英文，自动推断按文件名排序会把 install.md 排在 first-run.md
# 之前，而用户手册的阅读顺序恰恰相反（先跑起来，再谈安装细节）。显式导航的代价是
# 与 docs/README.md 存在重复，新增页面时两处都要改。
nav = [
  { "首页" = "README.md" },
  { "用户手册" = [
    { "手册首页" = "manual/index.md" },
    { "让 AI 帮你装" = "manual/ai-install.md" },
    # 这一段是读者第一次上手的顺序：先看够不够、再装、再配置、最后选桌宠还是服务器。
    # 顺序按读者心智排，不按文件名，改名或移动页面时这里要一起改。
    { "安装与部署" = [
      { "环境要求" = "manual/deployment/requirements.md" },
      { "下载与安装" = "manual/deployment/install.md" },
      { "第一次启动与配置" = "manual/deployment/first-run.md" },
      { "桌面桌宠" = "manual/deployment/windows.md" },
      { "无头部署" = "manual/deployment/headless.md" },
      { "升级与回退" = "manual/deployment/upgrade.md" },
    ] },
    { "配置" = [
      { "配置总览" = "manual/configuration/index.md" },
      { "bot.toml" = "manual/configuration/bot.md" },
      { "models.toml" = "manual/configuration/models.md" },
      { "providers.toml" = "manual/configuration/providers.md" },
      { "features.toml" = "manual/configuration/features.md" },
      { "适配器配置" = "manual/configuration/adapter.md" },
    ] },
    { "功能" = [
      { "功能总览" = "manual/features/index.md" },
      { "记忆" = "manual/features/memory.md" },
      { "表达方式与黑话" = "manual/features/expression-jargon.md" },
      { "表情包" = "manual/features/emoji.md" },
      { "主动搭话" = "manual/features/proactive.md" },
      { "人格与状态" = "manual/features/persona.md" },
      { "日程与睡眠" = "manual/features/schedule.md" },
      { "屏幕感知" = "manual/features/perception.md" },
      { "生图管线" = "manual/features/sprite.md" },
    ] },
    { "接入 QQ" = [
      { "接入总览" = "manual/adapters/index.md" },
      { "NapCat" = "manual/adapters/napcat.md" },
      { "SnowLuma" = "manual/adapters/snowluma.md" },
    ] },
    { "管理面板" = [
      { "面板总览" = "manual/webui/index.md" },
      { "会话观察" = "manual/webui/observe.md" },
      { "模型与厂商" = "manual/webui/models.md" },
      { "人物与关系" = "manual/webui/persons.md" },
      { "黑话词表" = "manual/webui/jargon.md" },
      { "表达方式" = "manual/webui/expressions.md" },
      { "记忆联想网络" = "manual/webui/memory-graph.md" },
      { "检索调优" = "manual/webui/retrieval-tuning.md" },
      { "导入中心" = "manual/webui/import-center.md" },
      { "记忆管理" = "manual/webui/memory-manage.md" },
      { "表情包库" = "manual/webui/emojis.md" },
      { "月璃设置" = "manual/webui/settings.md" },
      { "开发者命令" = "manual/webui/developer.md" },
    ] },
    { "出问题了" = [
      { "常见问题" = "manual/troubleshooting.md" },
    ] },
  ] },
  { "开发手册" = [
    { "架构" = [
